<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 Not Found - STACKLY</title>
    
    <link rel="stylesheet" href="css/style.css">
    
    <style>
        body {
            overflow: hidden; /* Prevent scrolling for the full-screen 404 */
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: linear-gradient(rgba(10, 15, 26, 0.9), rgba(10, 15, 26, 0.9)), url('assets/home_cover.webp') center/cover no-repeat;
        }

        .error-container {
            text-align: center;
            position: relative;
            z-index: 10;
        }

        .error-code {
            font-size: 10rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--primary-light), var(--primary-dark));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1;
            margin-bottom: 1rem;
            text-shadow: 0 10px 30px rgba(46,204,113,0.3);
        }

        .error-msg {
            font-size: 2rem;
            color: var(--secondary-color);
            margin-bottom: 2rem;
        }

        .error-actions {
            display: flex;
            gap: 1rem;
            justify-content: center;
        }

        /* Abstract Background Elements */
        .shape {
            position: absolute;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(46,204,113,0.2) 0%, transparent 70%);
            z-index: -1;
        }
        .shape-1 { width: 500px; height: 500px; top: -100px; left: -100px; }
        .shape-2 { width: 400px; height: 400px; bottom: -50px; right: -100px; }
        
        .floating-404 {
            position: absolute;
            font-size: 5rem;
            color: rgba(255,255,255,0.02);
            font-weight: bold;
            z-index: -1;
        }

        @media (max-width: 768px) {
            .shape-1 { width: 300px; height: 300px; }
            .shape-2 { width: 250px; height: 250px; }
            .error-code { font-size: 6rem; }
            .error-msg { font-size: 1.5rem; }
            .floating-404 { font-size: 3rem; }
        }

    </style>
</head>
<body>

    <div class="shape shape-1"></div>
    <div class="shape shape-2"></div>
    
    <!-- Decorative floating elements -->
    <div class="floating-404" style="top: 10%; left: 20%;">404</div>
    <div class="floating-404" style="top: 70%; left: 10%;">Not Found</div>
    <div class="floating-404" style="top: 20%; right: 20%;">Error</div>
    <div class="floating-404" style="top: 80%; right: 15%;">404</div>

    <div class="error-container">
        <div class="error-code">404</div>
        <div class="error-msg">Oops! Looks like you're lost.</div>
        <p style="margin-bottom: 2rem; max-width: 400px; margin-left: auto; margin-right: auto;">The page you are looking for might have been removed, had its name changed, or is temporarily unavailable.</p>
        
        <div class="error-actions">
            <button onclick="history.back()" class="btn btn-outline">Go Back</button>
            <a href="404.html" class="btn btn-primary">Back to Home</a>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script>
        // GSAP Animations
        document.addEventListener('DOMContentLoaded', () => {
            gsap.from('.error-code', { opacity: 0, scale: 0.5, duration: 1.5, ease: "elastic.out(1, 0.3)" });
            gsap.from('.error-msg', { opacity: 0, y: 30, duration: 1, delay: 0.5, ease: "power3.out" });
            gsap.from('p', { opacity: 0, y: 20, duration: 1, delay: 0.8, ease: "power3.out" });
            gsap.from('.error-actions', { opacity: 0, y: 20, duration: 1, delay: 1, ease: "power3.out" });

            // Floating elements animation
            const floaters = document.querySelectorAll('.floating-404');
            floaters.forEach(el => {
                gsap.to(el, {
                    y: 'random(-50, 50)',
                    x: 'random(-30, 30)',
                    rotation: 'random(-15, 15)',
                    duration: 'random(5, 10)',
                    repeat: -1,
                    yoyo: true,
                    ease: 'sine.inOut'
                });
            });
        });
    </script>
</body>
</html>
